services:
  api:
    build:
      context: .
      dockerfile: src/HrmAiOps.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  web:
    build:
      context: .
      dockerfile: src/frontend/hrm-aiops-web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
